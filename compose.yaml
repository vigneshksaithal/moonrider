services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moonrider
      POSTGRES_USER: moonrider
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonrider -d moonrider"]
      interval: 3s
      timeout: 3s
      retries: 20
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ok"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://moonrider:local-demo-only@postgres:5432/moonrider?sslmode=disable
      MQTT_BROKER: tcp://mqtt:1883
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    init: true
    restart: on-failure
volumes:
  postgres_data:
  mqtt_data:
